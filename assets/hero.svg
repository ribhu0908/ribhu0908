<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#120b2e"/>
      <stop offset="1" stop-color="#03141c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
      <stop offset="0" stop-color="#24c6dc"/>
      <stop offset="0.35" stop-color="#8a7cff"/>
      <stop offset="0.7" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#24c6dc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="clip"><rect width="1200" height="380" rx="22"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#24c6dc" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .blob { animation: float 12s ease-in-out infinite alternate; }
    .b2 { animation-duration: 15s; animation-delay: -4s; }
    .b3 { animation-duration: 18s; animation-delay: -8s; }
    @keyframes float { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px,-40px) scale(1.25); } 100% { transform: translate(-90px,30px) scale(0.9); } }
    .gridmove { animation: gm 4s linear infinite; }
    @keyframes gm { from { transform: translateY(0); } to { transform: translateY(40px); } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(420px); } }
    .name { font: 800 76px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 6px; }
    .hi { font: 600 20px 'Consolas', 'Courier New', monospace; fill: #24c6dc; letter-spacing: 4px; opacity: 0; animation: in 1s ease forwards 0.2s; }
    .name { opacity: 0; animation: in 1.2s ease forwards 0.5s; }
    @keyframes in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .role { font: 600 26px 'Segoe UI', Arial, sans-serif; fill: #e6edf3; opacity: 0; animation: role 9s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; }
    @keyframes role { 0%, 100% { opacity: 0; transform: translateY(14px); } 5%, 28% { opacity: 1; transform: translateY(0); } 33% { opacity: 0; transform: translateY(-14px); } }
    .dot { fill: #24c6dc; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
    .ring { fill: none; stroke: #8a7cff; stroke-opacity: 0.35; stroke-dasharray: 6 10; transform-origin: 1040px 190px; animation: spin 20s linear infinite; }
    .ring2 { stroke: #24c6dc; transform-origin: 1040px 190px; animation: spin 14s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .core { animation: pulse 2.4s ease-in-out infinite; transform-origin: 1040px 190px; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.18); opacity: 1; } }
    .line { stroke: url(#name); stroke-width: 3; stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.6s ease forwards 1s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <g class="gridmove"><rect y="-40" width="1200" height="460" fill="url(#grid)"/></g>
    <g filter="url(#blur)">
      <circle class="blob" cx="220" cy="120" r="140" fill="#302b63"/>
      <circle class="blob b2" cx="760" cy="300" r="150" fill="#0e6f82" opacity="0.7"/>
      <circle class="blob b3" cx="1050" cy="80" r="120" fill="#7a2a8c" opacity="0.6"/>
    </g>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#24c6dc" opacity="0.25"/>

    <!-- stars -->
    <circle class="dot" cx="90" cy="60" r="2"/>
    <circle class="dot" cx="400" cy="40" r="1.6" style="animation-delay:.6s"/>
    <circle class="dot" cx="640" cy="80" r="2" style="animation-delay:1.2s"/>
    <circle class="dot" cx="860" cy="330" r="1.8" style="animation-delay:.3s"/>
    <circle class="dot" cx="300" cy="340" r="1.6" style="animation-delay:1.8s"/>
    <circle class="dot" cx="560" cy="320" r="2" style="animation-delay:2.2s"/>
    <circle class="dot" cx="1150" cy="340" r="1.8" style="animation-delay:.9s"/>

    <!-- AI core -->
    <circle class="ring" cx="1040" cy="190" r="110" stroke-width="2"/>
    <circle class="ring ring2" cx="1040" cy="190" r="80" stroke-width="2"/>
    <g class="core">
      <circle cx="1040" cy="190" r="44" fill="#24c6dc" opacity="0.15"/>
      <circle cx="1040" cy="190" r="28" fill="none" stroke="#24c6dc" stroke-width="3" filter="url(#glow)"/>
      <text x="1040" y="199" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="24" fill="#e6edf3">AI</text>
    </g>
    <g fill="#ff4fd8">
      <circle r="5" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M1040 80 a110 110 0 1 1 -0.1 0z"/></circle>
    </g>
    <g fill="#24c6dc">
      <circle r="4" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M1040 270 a80 80 0 1 1 0.1 0z"/></circle>
    </g>

    <!-- text -->
    <text class="hi" x="80" y="110">&gt; HELLO WORLD, I'M</text>
    <text class="name" x="76" y="195" fill="url(#name)" filter="url(#glow)">RIBHU MUKHERJEE</text>
    <line class="line" x1="80" y1="222" x2="600" y2="222"/>
    <text class="role" x="80" y="275">🤖  I build AI agents that actually work</text>
    <text class="role r2" x="80" y="275">🚀  I teach AI careers to thousands</text>
    <text class="role r3" x="80" y="275">⚡  n8n · LLMs · RAG · Automation</text>
  </g>
  <rect width="1198" height="378" x="1" y="1" rx="22" fill="none" stroke="#24c6dc" stroke-opacity="0.35"/>
</svg>

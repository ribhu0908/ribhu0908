  <g clip-path="url(#l5)"><text x="28" y="230"><tspan class="p">➜ ~</tspan><tspan class="c"> cat side_quest.txt</tspan></text></g>
  <g clip-path="url(#l6)"><text x="28" y="262" class="o">🚀 Mentoring engineers on careers, GATE &amp; AI-era jobs</text></g>
  <g clip-path="url(#l7)"><text x="28" y="304"><tspan class="p">➜ ~</tspan><tspan class="c"> echo $SOCIALS</tspan></text></g>
  <g clip-path="url(#l8)"><text x="28" y="336"><tspan class="k">📸 Instagram</tspan><tspan class="o"> → @ribhu_susmita</tspan></text></g>

  <g opacity="0"><animate attributeName="opacity" to="1" dur="0.01s" begin="7.4s" fill="freeze"/>
    <text x="28" y="376"><tspan class="p">➜ ~</tspan></text>
